<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stimulation Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }
        
        .main-game {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .sidebar {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .click-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .click-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        
        .click-button:active {
            transform: scale(0.95);
        }
        
        .stats {
            margin: 20px 0;
            font-size: 18px;
        }
        
        .upgrade {
            background: rgba(255, 255, 255, 0.2);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .upgrade:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .upgrade.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .email-section {
            margin-top: 20px;
            padding: 0;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            display: none;
            color: #333;
            height: 500px;
            overflow: hidden;
        }
        
        .email-header {
            background: #1a73e8;
            color: white;
            padding: 15px 20px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: between;
            align-items: center;
        }
        
        .email-toolbar {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .email-toolbar button {
            background: white;
            border: 1px solid #dadce0;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .email-toolbar button:hover {
            background: #f1f3f4;
        }
        
        .email-layout {
            display: flex;
            height: 400px;
        }
        
        .email-sidebar {
            width: 200px;
            background: #fafafa;
            border-right: 1px solid #e0e0e0;
            padding: 10px;
        }
        
        .email-folder {
            padding: 8px 12px;
            margin: 2px 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .email-folder:hover {
            background: #e8f0fe;
        }
        
        .email-folder.active {
            background: #e8f0fe;
            color: #1a73e8;
            font-weight: 500;
        }
        
        .email-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .email-list-container {
            flex: 1;
            overflow-y: auto;
        }
        
        .email-item {
            border-bottom: 1px solid #e0e0e0;
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        
        .email-item:hover {
            background: #f1f3f4;
        }
        
        .email-item.unread {
            background: white;
            font-weight: 500;
        }
        
        .email-item.read {
            background: #f8f9fa;
            font-weight: 400;
        }
        
        .email-item.selected {
            background: #e8f0fe !important;
        }
        
        .email-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #1a73e8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        
        .email-content {
            flex: 1;
            min-width: 0;
        }
        
        .email-sender {
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .email-subject {
            color: #333;
            margin-bottom: 2px;
        }
        
        .email-preview {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .email-time {
            color: #666;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .email-compose-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .email-compose-window {
            background: white;
            border-radius: 8px;
            width: 500px;
            max-height: 600px;
            box-shadow: 0 24px 38px rgba(0,0,0,0.14);
        }
        
        .compose-header {
            background: #1a73e8;
            color: white;
            padding: 16px 20px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .compose-close {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }
        
        .compose-body {
            padding: 20px;
        }
        
        .compose-field {
            margin-bottom: 16px;
        }
        
        .compose-field label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 14px;
        }
        
        .compose-field input, .compose-field textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .compose-field textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .compose-actions {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }
        
        .btn-primary {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-secondary {
            background: white;
            color: #1a73e8;
            border: 1px solid #dadce0;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .email-view {
            display: none;
            flex-direction: column;
            height: 100%;
            background: white;
        }
        
        .email-view-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .email-view-subject {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        
        .email-view-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #666;
        }
        
        .email-view-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        .email-view-actions {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }
        
        .unread-count {
            background: #ea4335;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .email-search {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            font-size: 14px;
            background: #f1f3f4;
        }
        
        .floating-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            z-index: 1000;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
        
        .players-list {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .player {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .player img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-game">
            <h1> Stimulation Clicker</h1>
            <div class="stats">
                <div>Stimulation Points: <span id="points">0</span></div>
                <div>Points per Click: <span id="perClick">1</span></div>
                <div>Points per Second: <span id="perSecond">0</span></div>
            </div>
            <button class="click-button" id="clickButton">
                CLICK ME
            </button>
            <div id="clickEffect"></div>
        </div>
        
        <div class="sidebar">
            <h3> Upgrades</h3>
            <div id="upgrades"></div>
            
            <div class="email-section" id="emailSection">
                <div class="email-header">
                    <h3> Stimulation Mail</h3>
                    <button onclick="openCompose()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer;"> Compose</button>
                </div>
                
                <div class="email-toolbar">
                    <input type="text" class="email-search" placeholder="Search mail..." id="emailSearch" oninput="searchEmails()">
                    <button onclick="markAllRead()">Mark all read</button>
                    <button onclick="refreshEmails()"> Refresh</button>
                </div>
                
                <div class="email-layout">
                    <div class="email-sidebar">
                        <div class="email-folder active" data-folder="inbox" onclick="selectFolder('inbox')">
                            Inbox
                            <span class="unread-count" id="inboxCount">0</span>
                        </div>
                        <div class="email-folder" data-folder="sent" onclick="selectFolder('sent')">
                            Sent
                        </div>
                        <div class="email-folder" data-folder="ai" onclick="selectFolder('ai')">
                            AI Messages
                            <span class="unread-count" id="aiCount">0</span>
                        </div>
                        <div class="email-folder" data-folder="spam" onclick="selectFolder('spam')">
                            Spam
                        </div>
                    </div>
                    
                    <div class="email-main">
                        <div class="email-list-container" id="emailListContainer">
                            <div id="emailList"></div>
                        </div>
                        
                        <div class="email-view" id="emailView">
                            <div class="email-view-header">
                                <div class="email-view-subject" id="viewSubject"></div>
                                <div class="email-view-meta">
                                    <div class="email-avatar" id="viewAvatar"></div>
                                    <span id="viewSender"></span>
                                    <span id="viewTime"></span>
                                </div>
                            </div>
                            <div class="email-view-content" id="viewContent"></div>
                            <div class="email-view-actions">
                                <button class="btn-secondary" onclick="replyToEmail()"> Reply</button>
                                <button class="btn-secondary" onclick="deleteEmail()"> Delete</button>
                                <button class="btn-secondary" onclick="closeEmailView()"> Back to list</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Compose Modal -->
            <div class="email-compose-modal" id="composeModal">
                <div class="email-compose-window">
                    <div class="compose-header">
                        <span>New Message</span>
                        <button class="compose-close" onclick="closeCompose()">×</button>
                    </div>
                    <div class="compose-body">
                        <div class="compose-field">
                            <label>To:</label>
                            <input type="text" id="composeTo" placeholder="recipient@example.com or 'AI'">
                        </div>
                        <div class="compose-field">
                            <label>Subject:</label>
                            <input type="text" id="composeSubject" placeholder="Enter subject">
                        </div>
                        <div class="compose-field">
                            <label>Message:</label>
                            <textarea id="composeContent" placeholder="Write your message..."></textarea>
                        </div>
                    </div>
                    <div class="compose-actions">
                        <button class="btn-primary" onclick="sendEmailFromCompose()">Send</button>
                        <button class="btn-secondary" onclick="closeCompose()">Cancel</button>
                    </div>
                </div>
            </div>
            
            <div class="players-list">
                <h3> Online Players</h3>
                <div id="playersList"></div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let gameState = {
            points: 0,
            pointsPerClick: 1,
            pointsPerSecond: 0,
            upgrades: {},
            emails: [],
            sentEmails: [],
            hasEmailUpgrade: false,
            currentFolder: 'inbox',
            selectedEmail: null,
            searchQuery: ''
        };

        // Multiplayer setup
        const room = new WebsimSocket();
        let isInitialized = false;

        // Upgrade definitions
        const upgradeDefinitions = [
            {
                id: 'clickPower',
                name: ' Click Power',
                description: 'Increases click power',
                baseCost: 10,
                costMultiplier: 1.5,
                effect: () => gameState.pointsPerClick += 1
            },
            {
                id: 'autoClicker',
                name: ' Auto Clicker',
                description: 'Automatically clicks for you',
                baseCost: 50,
                costMultiplier: 2,
                effect: () => gameState.pointsPerSecond += 1
            },
            {
                id: 'stimulationBoost',
                name: ' Stimulation Boost',
                description: 'AI-powered stimulation enhancement',
                baseCost: 100,
                costMultiplier: 2.5,
                effect: async () => {
                    const boost = await getAIStimulationBoost();
                    gameState.pointsPerClick += boost.clickBonus;
                    gameState.pointsPerSecond += boost.autoBonus;
                    showFloatingText(`+${boost.clickBonus} click power! +${boost.autoBonus} auto!`);
                }
            },
            {
                id: 'email',
                name: ' Email System',
                description: 'Unlock email communication with other players and AI entities',
                baseCost: 200,
                costMultiplier: 1,
                maxLevel: 1,
                effect: () => {
                    gameState.hasEmailUpgrade = true;
                    document.getElementById('emailSection').style.display = 'block';
                    startEmailSystem();
                }
            },
            {
                id: 'socialNetwork',
                name: ' Social Network',
                description: 'Connect with AI influencers and thought leaders',
                baseCost: 500,
                costMultiplier: 3,
                effect: async () => {
                    await addAIContact();
                }
            }
        ];

        async function initGame() {
            try {
                await room.initialize();
                isInitialized = true;
                
                // Initialize player presence
                room.updatePresence({
                    points: gameState.points,
                    pointsPerClick: gameState.pointsPerClick,
                    pointsPerSecond: gameState.pointsPerSecond,
                    lastActive: Date.now()
                });

                // Listen for email messages
                room.onmessage = (event) => {
                    try {
                        const data = event.data;
                        switch (data.type) {
                            case "email":
                                receiveEmail(data.from, data.subject || "No Subject", data.content, data.fromAI);
                                break;
                            case "connected":
                                updatePlayersList();
                                break;
                            case "disconnected":
                                updatePlayersList();
                                break;
                        }
                    } catch (error) {
                        console.error('Error handling message:', error);
                    }
                };

                room.subscribePresence(() => {
                    try {
                        updatePlayersList();
                    } catch (error) {
                        console.error('Error updating players list:', error);
                    }
                });

                // Start AI bots
                setTimeout(() => {
                    startAIBots();
                }, 3000);

            } catch (error) {
                console.error('Failed to initialize multiplayer:', error);
                // Continue with single-player mode
                isInitialized = false;
            }

            setupGame();
        }

        function setupGame() {
            const clickButton = document.getElementById('clickButton');
            clickButton.addEventListener('click', handleClick);
            
            renderUpgrades();
            updateDisplay();
            
            // Auto-increment timer
            setInterval(() => {
                if (gameState.pointsPerSecond > 0) {
                    gameState.points += gameState.pointsPerSecond;
                    updateDisplay();
                    updatePresence();
                }
            }, 1000);
        }

        function handleClick(event) {
            gameState.points += gameState.pointsPerClick;
            
            // Visual feedback
            const rect = event.target.getBoundingClientRect();
            showFloatingText(`+${gameState.pointsPerClick}`, 
                rect.left + rect.width/2, 
                rect.top + rect.height/2);
            
            updateDisplay();
            updatePresence();
        }

        function showFloatingText(text, x = null, y = null) {
            const element = document.createElement('div');
            element.className = 'floating-text';
            element.textContent = text;
            
            if (x === null || y === null) {
                const clickButton = document.getElementById('clickButton');
                const rect = clickButton.getBoundingClientRect();
                x = rect.left + rect.width/2;
                y = rect.top + rect.height/2;
            }
            
            element.style.left = x + 'px';
            element.style.top = y + 'px';
            element.style.animation = 'floatUp 2s ease-out forwards';
            
            document.body.appendChild(element);
            
            setTimeout(() => {
                document.body.removeChild(element);
            }, 2000);
        }

        function updateDisplay() {
            document.getElementById('points').textContent = Math.floor(gameState.points);
            document.getElementById('perClick').textContent = gameState.pointsPerClick;
            document.getElementById('perSecond').textContent = gameState.pointsPerSecond;
            renderUpgrades();
        }

        function updatePresence() {
            if (isInitialized) {
                try {
                    room.updatePresence({
                        points: Math.floor(gameState.points),
                        pointsPerClick: gameState.pointsPerClick,
                        pointsPerSecond: gameState.pointsPerSecond,
                        lastActive: Date.now()
                    });
                } catch (error) {
                    console.error('Error updating presence:', error);
                }
            }
        }

        function renderUpgrades() {
            const upgradesContainer = document.getElementById('upgrades');
            upgradesContainer.innerHTML = '';
            
            upgradeDefinitions.forEach(upgrade => {
                const level = gameState.upgrades[upgrade.id] || 0;
                const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.costMultiplier, level));
                const canAfford = gameState.points >= cost;
                const maxReached = upgrade.maxLevel && level >= upgrade.maxLevel;
                
                const upgradeElement = document.createElement('div');
                upgradeElement.className = `upgrade ${(!canAfford || maxReached) ? 'disabled' : ''}`;
                upgradeElement.innerHTML = `
                    <div><strong>${upgrade.name}</strong> (Level ${level})</div>
                    <div>${upgrade.description}</div>
                    <div>${maxReached ? 'MAX LEVEL' : `Cost: ${cost} points`}</div>
                `;
                
                if (canAfford && !maxReached) {
                    upgradeElement.addEventListener('click', () => buyUpgrade(upgrade.id));
                }
                
                upgradesContainer.appendChild(upgradeElement);
            });
        }

        async function buyUpgrade(upgradeId) {
            const upgrade = upgradeDefinitions.find(u => u.id === upgradeId);
            const level = gameState.upgrades[upgradeId] || 0;
            const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.costMultiplier, level));
            
            if (gameState.points >= cost && (!upgrade.maxLevel || level < upgrade.maxLevel)) {
                gameState.points -= cost;
                gameState.upgrades[upgradeId] = level + 1;
                
                await upgrade.effect();
                updateDisplay();
                updatePresence();
            }
        }

        async function getAIStimulationBoost() {
            try {
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `You are managing a stimulation clicker game. Generate random positive effects for a "Stimulation Boost" upgrade. Respond with JSON only.
{
  "clickBonus": number (1-10),
  "autoBonus": number (0-5),
  "flavorText": "exciting description of the boost effect"
}`
                        },
                        {
                            role: "user",
                            content: `Generate a stimulation boost effect for a player with ${gameState.pointsPerClick} click power and ${gameState.pointsPerSecond} auto power.`
                        }
                    ],
                    json: true
                });
                
                return JSON.parse(completion.content);
            } catch (error) {
                console.error('AI boost failed:', error);
                return { clickBonus: 2, autoBonus: 1, flavorText: "Neural pathways optimized!" };
            }
        }

        // Email system
        function startEmailSystem() {
            // Send welcome email from AI
            setTimeout(() => {
                receiveEmail("Dr. Stimulation", "Welcome to Stimulation Mail! ",
                    "Welcome to the Email System!\n\nI'm Dr. Stimulation, your AI assistant. I'll be sending you tips and updates to help maximize your stimulation potential!\n\nTry sending me a message by typing 'AI' in the recipient field.\n\nBest regards,\nDr. Stimulation", true);
            }, 1000);
            
            updateEmailCounts();
        }

        function openCompose() {
            document.getElementById('composeModal').style.display = 'flex';
            document.getElementById('composeTo').focus();
        }

        function closeCompose() {
            document.getElementById('composeModal').style.display = 'none';
            document.getElementById('composeTo').value = '';
            document.getElementById('composeSubject').value = '';
            document.getElementById('composeContent').value = '';
        }

        async function sendEmailFromCompose() {
            const to = document.getElementById('composeTo').value;
            const subject = document.getElementById('composeSubject').value;
            const content = document.getElementById('composeContent').value;
            
            if (!to || !subject || !content) {
                alert('Please fill in all fields');
                return;
            }
            
            try {
                // Add to sent folder
                const sentEmail = {
                    to,
                    subject,
                    content,
                    timestamp: Date.now(),
                    read: true,
                    fromAI: false,
                    id: Date.now() + '_sent'
                };
                gameState.sentEmails.unshift(sentEmail);
                
                if (to.toLowerCase() === 'ai') {
                    // Send to AI
                    await sendAIEmail(subject, content);
                } else {
                    // Send to player
                    if (isInitialized) {
                        room.send({
                            type: "email",
                            to: to,
                            subject: subject,
                            content: content,
                            from: room.peers[room.clientId]?.username || "Anonymous",
                            echo: false
                        });
                    }
                }
                
                closeCompose();
                showFloatingText(' Email sent!');
            } catch (error) {
                console.error('Error sending email:', error);
                showFloatingText(' Failed to send email');
            }
        }

        async function sendAIEmail(subject, content) {
            try {
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `You are Dr. Stimulation, an AI assistant in a stimulation clicker game. Respond to player emails with enthusiasm and game-related advice. Include the subject line in your response context.`
                        },
                        {
                            role: "user",
                            content: `Subject: ${subject}\n\n${content}`
                        }
                    ]
                });
                
                setTimeout(() => {
                    receiveEmail("Dr. Stimulation", `Re: ${subject}`, completion.content, true);
                }, 1000 + Math.random() * 2000);
                
            } catch (error) {
                console.error('AI email failed:', error);
                receiveEmail("Dr. Stimulation", `Re: ${subject}`, "Error processing your message. Please try again!", true);
            }
        }

        function receiveEmail(from, subject, content, fromAI = false) {
            const email = {
                from,
                subject,
                content,
                timestamp: Date.now(),
                read: false,
                fromAI,
                id: Date.now() + '_' + Math.random()
            };
            
            gameState.emails.unshift(email);
            renderEmails();
            updateEmailCounts();
            
            // Show notification
            showFloatingText(` New email: ${subject}`);
        }

        function selectFolder(folder) {
            gameState.currentFolder = folder;
            document.querySelectorAll('.email-folder').forEach(f => f.classList.remove('active'));
            document.querySelector(`[data-folder="${folder}"]`).classList.add('active');
            renderEmails();
            closeEmailView();
        }

        function renderEmails() {
            const emailList = document.getElementById('emailList');
            emailList.innerHTML = '';
            
            let emails = [];
            switch (gameState.currentFolder) {
                case 'inbox':
                    emails = gameState.emails.filter(e => !e.fromAI);
                    break;
                case 'sent':
                    emails = gameState.sentEmails;
                    break;
                case 'ai':
                    emails = gameState.emails.filter(e => e.fromAI);
                    break;
                case 'spam':
                    emails = []; // No spam for now
                    break;
            }
            
            // Apply search filter
            if (gameState.searchQuery) {
                emails = emails.filter(e => 
                    e.subject.toLowerCase().includes(gameState.searchQuery.toLowerCase()) ||
                    e.from.toLowerCase().includes(gameState.searchQuery.toLowerCase()) ||
                    e.content.toLowerCase().includes(gameState.searchQuery.toLowerCase())
                );
            }
            
            emails.slice(0, 50).forEach((email, index) => {
                const emailElement = document.createElement('div');
                emailElement.className = `email-item ${email.read ? 'read' : 'unread'}`;
                emailElement.onclick = () => openEmail(email);
                
                const avatar = email.fromAI ? '' : email.from.charAt(0).toUpperCase();
                const preview = email.content.length > 50 ? email.content.substring(0, 50) + '...' : email.content;
                
                emailElement.innerHTML = `
                    <div class="email-avatar">${avatar}</div>
                    <div class="email-content">
                        <div class="email-sender">${email.from}</div>
                        <div class="email-subject">${email.subject}</div>
                        <div class="email-preview">${preview}</div>
                    </div>
                    <div class="email-time">${formatEmailTime(email.timestamp)}</div>
                `;
                
                emailList.appendChild(emailElement);
            });
            
            if (emails.length === 0) {
                emailList.innerHTML = '<div style="text-align: center; padding: 40px; color: #666;">No emails in this folder</div>';
            }
        }

        function openEmail(email) {
            gameState.selectedEmail = email;
            email.read = true;
            
            document.getElementById('emailListContainer').style.display = 'none';
            document.getElementById('emailView').style.display = 'flex';
            
            document.getElementById('viewSubject').textContent = email.subject;
            document.getElementById('viewSender').textContent = email.from;
            document.getElementById('viewTime').textContent = new Date(email.timestamp).toLocaleString();
            document.getElementById('viewContent').textContent = email.content;
            document.getElementById('viewAvatar').textContent = email.fromAI ? '' : email.from.charAt(0).toUpperCase();
            
            updateEmailCounts();
            renderEmails();
        }

        function closeEmailView() {
            document.getElementById('emailListContainer').style.display = 'block';
            document.getElementById('emailView').style.display = 'none';
            gameState.selectedEmail = null;
        }

        function replyToEmail() {
            if (!gameState.selectedEmail) return;
            
            openCompose();
            document.getElementById('composeTo').value = gameState.selectedEmail.from === 'Dr. Stimulation' ? 'AI' : gameState.selectedEmail.from;
            document.getElementById('composeSubject').value = 'Re: ' + gameState.selectedEmail.subject;
        }

        function deleteEmail() {
            if (!gameState.selectedEmail) return;
            
            const email = gameState.selectedEmail;
            if (email.fromAI) {
                gameState.emails = gameState.emails.filter(e => e.id !== email.id);
            } else {
                gameState.emails = gameState.emails.filter(e => e.id !== email.id);
            }
            
            closeEmailView();
            renderEmails();
            updateEmailCounts();
            showFloatingText(' Email deleted');
        }

        function searchEmails() {
            gameState.searchQuery = document.getElementById('emailSearch').value;
            renderEmails();
        }

        function markAllRead() {
            gameState.emails.forEach(e => e.read = true);
            updateEmailCounts();
            renderEmails();
        }

        function refreshEmails() {
            renderEmails();
            updateEmailCounts();
            showFloatingText(' Refreshed');
        }

        function updateEmailCounts() {
            const inboxUnread = gameState.emails.filter(e => !e.read && !e.fromAI).length;
            const aiUnread = gameState.emails.filter(e => !e.read && e.fromAI).length;
            
            const inboxCount = document.getElementById('inboxCount');
            const aiCount = document.getElementById('aiCount');
            
            inboxCount.textContent = inboxUnread;
            inboxCount.style.display = inboxUnread > 0 ? 'inline' : 'none';
            
            aiCount.textContent = aiUnread;
            aiCount.style.display = aiUnread > 0 ? 'inline' : 'none';
        }

        function formatEmailTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return new Date(timestamp).toLocaleDateString();
        }

        room.onmessage = (event) => {
            try {
                const data = event.data;
                switch (data.type) {
                    case "email":
                        receiveEmail(data.from, data.subject || "No Subject", data.content, data.fromAI);
                        break;
                    case "connected":
                        updatePlayersList();
                        break;
                    case "disconnected":
                        updatePlayersList();
                        break;
                }
            } catch (error) {
                console.error('Error handling message:', error);
            }
        };

        async function sendRandomAIEmail() {
            try {
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: `Generate a random email for a stimulation clicker game from an AI bot. Include game tips, motivational messages, or fun facts. Respond with JSON:
{
  "from": "AI name",
  "subject": "email subject",
  "content": "email content"
}`
                        },
                        {
                            role: "user",
                            content: `Player stats: ${gameState.points} points, ${gameState.pointsPerClick} per click, ${gameState.pointsPerSecond} per second`
                        }
                    ],
                    json: true
                });
                
                const result = JSON.parse(completion.content);
                receiveEmail(result.from, result.subject, result.content, true);
                
            } catch (error) {
                console.error('Random AI email failed:', error);
                // Fallback message if AI fails
                if (Math.random() < 0.5) {
                    receiveEmail("System Bot", "Stimulation Tips", "Keep clicking! Your stimulation levels are looking great! ", true);
                }
            }
        }

        function startAIBots() {
            // Random AI emails
            setInterval(async () => {
                if (gameState.hasEmailUpgrade && Math.random() < 0.3) {
                    await sendRandomAIEmail();
                }
            }, 30000); // Every 30 seconds, 30% chance
        }

        function updatePlayersList() {
            if (!isInitialized) return;
            
            try {
                const playersList = document.getElementById('playersList');
                playersList.innerHTML = '';
                
                Object.values(room.peers).forEach(peer => {
                    const presence = room.presence[peer.id] || {};
                    const playerElement = document.createElement('div');
                    playerElement.className = 'player';
                    playerElement.innerHTML = `
                        <img src="${peer.avatarUrl}" alt="${peer.username}">
                        <div>
                            <div>${peer.username}</div>
                            <div style="font-size: 12px; opacity: 0.7;">${presence.points || 0} points</div>
                        </div>
                    `;
                    playersList.appendChild(playerElement);
                });
            } catch (error) {
                console.error('Error updating players list:', error);
            }
        }

        // Initialize the game
        initGame();
    </script>
